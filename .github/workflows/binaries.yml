name: binaries

on:
  push:
    branches: [master]
    paths:
      - "bin/cli.js"
      - "src/pptxdiff/**"
      - "src/packages/binaries/**"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: macos-latest
            target: mac
          - runner: windows-latest
            target: win
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install
        working-directory: src/packages/binaries
      - run: npm run build
        working-directory: src/packages/binaries
      - uses: actions/upload-artifact@v4
        with:
          name: pptxdiff-${{ matrix.target }}
          path: src/packages/binaries/pptxdiff-${{ matrix.target }}/*.zip
          if-no-files-found: error
