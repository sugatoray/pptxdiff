site_name: PptxDiff
site_description: A single-file, client-side diff tool for comparing PowerPoint decks — real fidelity rendering, deep diffing, and a full reviewer workflow.
site_url: https://sugatoray.github.io/pptxdiff/
repo_name: sugatoray/pptxdiff
repo_url: https://github.com/sugatoray/pptxdiff
edit_uri: edit/master/src/pptxdiff/docs-site/docs/
copyright: Copyright &copy; Sugato Ray

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/img/pptxdiff_logo.png
  favicon: assets/img/icon_128x128.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - content.tooltips

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sugatoray/pptxdiff
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/pptxdiff
    - icon: material/microsoft-visual-studio-code
      link: https://marketplace.visualstudio.com/items?itemName=sugatoray.pptxdiff-vscode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
      - Overview: features/index.md
      - Rendering Fidelity: features/rendering.md
      - Diff Engine: features/diff-engine.md
      - Deck-Level Comparison: features/deck-comparison.md
      - Duplicate Detection: features/duplicate-detection.md
      - Reviewer Workflow: features/reviewer-workflow.md
      - Batch Mode: features/batch-mode.md
      - Three-Way Merge: features/merge.md
      - Exports & Live Push: features/exports.md
      - UI, Shortcuts & Themes: features/ui-shortcuts.md
      - Self-Tests: features/self-tests.md
  - CLI Reference: cli.md
  - VS Code Extension: vscode-extension.md
  - Architecture: architecture.md
  - Limitations: limitations.md
  - FAQ: faq.md
  - Changelog: changelog.md
